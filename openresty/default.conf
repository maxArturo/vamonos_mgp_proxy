# env API_TOKEN;

access_log /dev/stdout combined;
rewrite_log on;

proxy_cache_path /var/cache/nginx/main_cache levels=1:2 keys_zone=main_cache:100m max_size=500m inactive=10m;
proxy_cache_methods GET HEAD POST;

# locks all clients that request the same asset till the first is cached
proxy_cache_lock on;

# try to recover from upstream errors
proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;

server {
  listen 80;

  add_header X-Vamonos-Mgp-Cache-Status $upstream_cache_status;
  server_name "vamonos-mgp-proxy.fly.dev";

  location /providers/mgp/ {

    set $cache_body_key '';
    access_by_lua_file /scripts/check_api_key.lua;
    rewrite_by_lua_block {
      ngx.req.read_body() -- explicitly read the req body
      local data = ngx.req.get_body_data()

      if data then
      ngx.var.cache_body_key = ngx.md5(data)
      return
      end

      local file = ngx.req.get_body_file()

      if file then
      ngx.var.cache_body_key = ngx.md5(file)
      return
      else

      ngx.var.cache_body_key = ngx.md5("$proxy_host$request_uri")
      end
    }
    rewrite ^/providers/mgp(.*)$ $1 break;

    proxy_pass https://appsl.mardelplata.gob.ar;
    proxy_cache_key $proxy_host$request_uri$cache_body_key;
    proxy_ssl_server_name on;

    proxy_hide_header "Pragma";
    proxy_ignore_headers Expires Cache-Control Set-Cookie Vary;
    proxy_cache main_cache;
    proxy_cache_valid any 1m;
    expires 1m;
  }


  location /map_tiles/osm/ {
    access_by_lua_file /scripts/check_api_key.lua;
    rewrite ^/map_tiles/osm(.*)$ $1 break;

    proxy_hide_header "Pragma";
    proxy_ignore_headers Expires Cache-Control Set-Cookie Vary;
    proxy_pass https://tile.openstreetmap.org;
    proxy_cache main_cache;
    proxy_cache_valid any 7d;
    expires 7d;
  }
}
